<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AIサムネクリエイター・コウジの制作ポートフォリオ">
  <title>コウジ｜AIサムネクリエイター ポートフォリオ</title>
  <style>
    :root { --ink:#202124; --muted:#64676c; --rule:#e9e9e7; --navy:#1c355d; --gold:#e5ad27; }
    * { box-sizing:border-box; } html { scroll-behavior:smooth; }
    body { margin:0; color:var(--ink); background:#fff; font-family:"Noto Sans JP","Yu Gothic",system-ui,sans-serif; }
    .wrap { max-width:1160px; margin:auto; padding:0 34px; }
    .hero { max-width:1160px; min-height:278px; margin:26px auto 0; display:grid; grid-template-columns:1fr 1fr; overflow:hidden; border-bottom:1px solid var(--rule); }
    .hero-copy { display:flex; flex-direction:column; justify-content:center; padding:clamp(2rem,6vw,5.2rem); }
    .kicker { margin:0 0 .9rem; color:var(--gold); letter-spacing:.24em; font-size:.72rem; font-weight:800; }
    .hero h1 { margin:0; color:#121212; font-family:Georgia,"Times New Roman",serif; font-size:clamp(2.2rem,5.5vw,4.6rem); letter-spacing:.07em; line-height:.94; font-weight:500; }
    .hero h1 span { display:block; margin-top:.42em; font-family:Arial,sans-serif; font-size:.36em; letter-spacing:.14em; }
    .hero-art { position:relative; overflow:hidden; background:linear-gradient(135deg,#f7f4ec,#eef2f8); }
    .hero-art::before { content:""; position:absolute; inset:0; background:repeating-linear-gradient(90deg,transparent 0 38px,#1c355d0c 39px 40px),repeating-linear-gradient(0deg,transparent 0 38px,#1c355d0c 39px 40px); transform:skewY(-10deg) scale(1.25); }
    .mark { position:absolute; right:13%; top:50%; width:180px; height:180px; transform:translateY(-50%); border:9px solid var(--navy); border-radius:50%; display:grid; place-items:center; color:var(--navy); font-size:5rem; font-weight:900; box-shadow:18px 18px 0 #e5ad2740; }
    main { padding:58px 0 0; } .page-title { display:flex; align-items:center; gap:12px; margin:0 0 58px; font-size:2.05rem; }
    .page-title::before { content:""; width:28px; height:28px; background:var(--gold); clip-path:polygon(0 0,100% 0,100% 72%,50% 100%,0 72%); }
    section { margin-bottom:74px; } h2 { margin:0 0 28px; font-size:1.28rem; letter-spacing:.015em; }
    .works { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:clamp(16px,2.3vw,30px); }
    figure { margin:0; } .thumb { display:block; width:100%; aspect-ratio:16/9; overflow:hidden; background:#f1f2f3; border:1px solid var(--rule); }
    img { width:100%; height:100%; display:block; object-fit:contain; background:#f1f2f3; transition:transform .25s ease; } figure:hover img { transform:scale(1.025); }
    figcaption { padding:.7rem .05rem 0; color:var(--muted); font-size:.83rem; }.label { display:inline-block; margin-left:.38rem; padding:.09rem .42rem; border:1px solid #d7b562; border-radius:99px; color:#785906; font-size:.74em; vertical-align:middle; }
    .about { padding:32px; border-top:1px solid var(--rule); background:#fafafa; }.about h2 { margin-bottom:15px; }.about p { max-width:760px; margin:0; color:#4d5054; font-size:.94rem; line-height:1.9; }
    footer { margin-top:72px; padding:28px; border-top:1px solid var(--rule); color:#84878b; text-align:center; font-size:.78rem; }
    @media (max-width:720px) { .wrap{padding:0 20px}.hero{margin-top:0;min-height:0;grid-template-columns:1fr}.hero-copy{padding:3.2rem 2.1rem}.hero-art{min-height:180px}.mark{width:122px;height:122px;border-width:6px;font-size:3.5rem}main{padding-top:42px}.page-title{margin-bottom:40px;font-size:1.7rem}.works{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}section{margin-bottom:52px}.about{padding:24px 20px}}@media (max-width:430px){.works{grid-template-columns:1fr}}
  </style>
</head>
<body>

  <main class="wrap">

      <figure><div class="thumb"><img src="assets/stretching.png" alt="女性向けストレッチサムネイル"></div><figcaption>健康・運動｜ストレッチ <span class="label">自主制作</span></figcaption></figure>
